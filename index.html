<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
        // Captures everything after the domain name (like /musicvideos)
        var currentPath = window.location.pathname + window.location.search + window.location.hash;
        // Forwards them to the exact same path on the live site
        window.location.href = "https://www.majinplanet.com/dragonball/" + currentPath;
    </script>
</head>
<body>
    <p>Redirecting... If you are not forwarded, <a href="https://www.majinplanet.com/dragonball/">click here</a>.</p>
</body>
</html>
