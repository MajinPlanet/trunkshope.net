<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
        // Captures the broken path they tried to visit (like /legacy/)
        var currentPath = window.location.pathname + window.location.search + window.location.hash;
        // Forwards them immediately to the live WordPress site matching page
        window.location.href = "https://www.majinplanet.com/project/trunkshope/" + currentPath;
    </script>
</head>
<body>
    <p>Redirecting... If you are not forwarded automatically, <a href="https://www.majinplanet.com/project/trunkshope/">click here</a>.</p>
</body>
</html>
